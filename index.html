<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metaballs 2.0</title>
<meta name="description" content="Raymarched metaballs in one WebGL 2 shader: orbit camera, three lights, soft shadows and an X-ray view of the field.">
<style>
  :root {
    --ink: #0b1117; --panel: rgba(12, 19, 26, 0.86); --line: rgba(140, 190, 210, 0.18);
    --text: #d8e6ec; --dim: #8aa3ae; --accent: #54aeeb; --amber: #ffa046;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .panel { position: fixed; top: 16px; left: 16px; width: 280px; max-height: calc(100% - 32px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
  .panel summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: baseline; gap: 8px; }
  .panel summary::-webkit-details-marker { display: none; }
  .panel summary h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .panel summary span { color: var(--dim); }
  .panel summary::after { content: "–"; margin-left: auto; color: var(--dim); }
  .panel:not([open]) summary::after { content: "+"; }
  .body { padding: 0 14px 14px; }
  h2 { margin: 14px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
  .modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .modes button { font: inherit; font-size: 12px; padding: 6px 0; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #04121c; }
  .note { margin: 8px 0 0; color: var(--dim); min-height: 3.6em; }
  .row { display: grid; grid-template-columns: 78px 1fr 40px; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { color: var(--dim); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row input[type="range"] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--dim); }
  .check input { accent-color: var(--accent); }
  .buttons { display: flex; gap: 6px; margin-top: 10px; }
  .buttons button { flex: 1; font: inherit; padding: 6px 0; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  dl { display: grid; grid-template-columns: 78px 1fr; gap: 2px 8px; margin: 0; }
  dt { color: var(--dim); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  .hint { margin: 12px 0 0; color: var(--dim); }
  a { color: var(--accent); }
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 600px) {
    .panel { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; max-height: 55%; }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="Raymarched metaballs. Drag a light orb to move it, drag elsewhere to orbit, scroll or pinch to zoom, double-click to reset."></canvas>

<details class="panel" id="panel" open>
  <summary><h1>metaballs 2.0</h1><span>raymarched</span></summary>
  <div class="body">
    <h2>X-ray</h2>
    <div class="modes" role="group" aria-label="Render mode" id="modes"></div>
    <p class="note" id="note"></p>

    <h2>Parameters</h2>
    <div id="params"></div>
    <div class="buttons">
      <button type="button" id="shuffle">New seed</button>
      <button type="button" id="reset">Reset</button>
    </div>

    <h2>Frame</h2>
    <dl>
      <dt>Backend</dt><dd id="backend">starting</dd>
      <dt>Frame</dt><dd id="ms">–</dd>
      <dt>Resolution</dt><dd id="res">–</dd>
    </dl>
    <p class="hint">Drag a light orb to move that light. Drag anywhere else to orbit, scroll or pinch to zoom,
      double-click to reset the view. Keys: arrows, + and -, R.
      <a href="https://github.com/kircherv/metaballs">Source (MIT)</a></p>
  </div>
</details>

<script src="metaballs.js"></script>
<script src="demo.js"></script>
</body>
</html>
